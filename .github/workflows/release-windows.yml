name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64 release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test
        shell: pwsh
        run: cargo test --locked

      - name: Build release binary
        shell: pwsh
        run: cargo build --release --locked --bin imm-native

      - name: Package portable zip
        shell: pwsh
        run: |
          $versionLine = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $version = $versionLine.Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Path dist\release -Force | Out-Null
          Copy-Item target\release\imm-native.exe dist\release\imm.exe
          Compress-Archive -Path dist\release\imm.exe -DestinationPath dist\imm-windows-x64.zip -Force
          $sha256 = (Get-FileHash dist\imm-windows-x64.zip -Algorithm SHA256).Hash
          "IMM_VERSION=$version" >> $env:GITHUB_ENV
          "IMM_WINDOWS_X64_SHA256=$sha256" >> $env:GITHUB_ENV
          "Windows x64 SHA256: $sha256" >> $env:GITHUB_STEP_SUMMARY

      - name: Generate winget manifests
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="v${IMM_VERSION}"
          fi
          scripts/generate-winget-manifest.sh \
            --version "$IMM_VERSION" \
            --sha256 "$IMM_WINDOWS_X64_SHA256" \
            --release-tag "$release_tag" \
            --release-date "$(date -u +%F)" \
            --output-dir dist/winget

      - name: Archive winget manifests
        shell: pwsh
        run: Compress-Archive -Path dist\winget\* -DestinationPath dist\imm-winget-manifests.zip -Force

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: imm-windows-x64
          path: |
            dist/imm-windows-x64.zip
            dist/imm-winget-manifests.zip

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = @"
          Windows x64 portable release for IMM.

          SHA256:
          $env:IMM_WINDOWS_X64_SHA256
          "@
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist\imm-windows-x64.zip dist\imm-winget-manifests.zip --clobber
          } else {
            gh release create $tag dist\imm-windows-x64.zip dist\imm-winget-manifests.zip --title $tag --notes $notes
          }
