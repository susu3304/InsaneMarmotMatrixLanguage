[package]
name = "imm-native"
version = "0.2.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
async-recursion = "1"
tokio = { version = "1", features = ["rt", "time", "macros", "net", "io-util", "sync"] }

[lib]
name = "imm_native"
path = "src/lib.rs"

[[bin]]
name = "imm-native"
path = "src/main.rs"
