[package]
name = "imm-native"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[lib]
name = "imm_native"
path = "src/lib.rs"

[[bin]]
name = "imm-native"
path = "src/main.rs"
